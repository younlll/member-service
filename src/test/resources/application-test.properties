spring.application.name=member-service

# JWT \uC124\uC815
jwt.secret=mySecretKey123456789012345678901234567890
jwt.token-validity-in-seconds=86400

# \uCE74\uCE74\uC624 OAuth \uC124\uC815
kakao.client-id=fa0023a069174ae6dbc7b91b6c8a1246
kakao.redirect-uri=http://localhost:8080/api/auth/kakao/callback

# \uCE74\uCE74\uC624 OAuth URL
kakao.auth-url=https://kauth.kakao.com/oauth/authorize/
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.logout-url=https://kapi.kakao.com/v1/user/logout



# \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC124\uC815
spring.datasource.url=jdbc:mysql://localhost:3306/member_service?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA \uC124\uC815
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# \uB85C\uAE45 \uC124\uC815
logging.level.com.member=DEBUG
logging.level.org.springframework.security=DEBUG

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
