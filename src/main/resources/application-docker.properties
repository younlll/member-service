# ============================================
# Docker Container Environment
# ============================================
spring.data.redis.host=member-redis
spring.data.redis.port=6379
# Database Configuration - Docker MySQL Container
spring.datasource.url=jdbc:mysql://member-db:3306/member_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Connection Pool Settings (Optimized for Container)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
# JPA Settings - Docker Environment
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
# JWT Configuration - Docker
jwt.secret=dockerEnvironmentSecretKeyForMemberServiceJava21Environment123456789012345678901234567890abcdef
jwt.expiration=86400000
#Logging Configuration - Docker (Optimized)
logging.level.com.location.member=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{20} - %msg%n
# Performance Optimization for Container
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Cache Configuration
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
# Kakao OAuth Configuration
kakao.client-id=${KAKAO_CLIENT_ID:fa0023a069174ae6dbc7b91b6c8a1246}
kakao.auth-url=https://kauth.kakao.com/oauth/authorize
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.logout-url=https://kapi.kakao.com/v1/user/logout
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8081/api/auth/kakao/callback}
# Server Configuration
server.port=8081
# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
