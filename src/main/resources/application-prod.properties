# ============================================================================
# member-service — 배포(prod) 프로필
# ----------------------------------------------------------------------------
# 이 파일은 저장소에 커밋된다. 따라서 시크릿을 직접 적지 않는다.
# 모든 비밀값은 ${ENV_VAR} 참조이며 실제 값은 배포 플랫폼(Railway) 환경변수로 주입한다.
# 기본값이 있는 항목은 ${ENV:default} 형태로, 기본값이 없는 항목은 미주입 시 기동 실패한다(의도된 동작).
#
# 필수 환경변수 목록은 docs/DEPLOYMENT.md 참고.
# ============================================================================

spring.application.name=member-service

# Railway 는 컨테이너에 PORT 를 동적으로 주입한다. 고정 포트로 바인딩하면 헬스체크가 실패한다.
server.port=${PORT:8083}

# ---------------------------------------------------------------- DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# 스키마는 init SQL 로 선주입한다. 운영 중 자동 변경을 막기 위해 none 을 기본값으로 둔다.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# --------------------------------------------------------------------- Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2

# ----------------------------------------------------------------------- JWT
# 반드시 배포마다 새로 발급한 값을 주입한다. dev 용 시크릿 재사용 금지.
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
jwt.token-validity-in-seconds=${JWT_TOKEN_VALIDITY_SECONDS:86400}

# --------------------------------------------------------------------- Kakao
# redirect-uri 는 배포 도메인 기준이어야 하며, 카카오 개발자센터에도 동일 값이 등록되어야 한다.
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.auth-url=https://kauth.kakao.com/oauth/authorize/
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.logout-url=https://kapi.kakao.com/v1/user/logout

# ------------------------------------------------------------- 서비스 간 통신
# Railway 사설망 주소를 쓴다(예: http://group-service.railway.internal:8081).
group-service.base-url=${GROUP_SERVICE_URL}

# --------------------------------------------------------------------- Image
# base-url 은 클라이언트가 접근하는 공개 도메인이어야 한다. localhost 면 앱에서 이미지가 깨진다.
# upload-dir 은 영속 볼륨 마운트 경로와 일치해야 한다(미마운트 시 재배포마다 소실).
app.image.upload-dir=${IMAGE_UPLOAD_DIR:/app/images}
app.image.profile-dir=profile
app.image.base-url=${APP_PUBLIC_URL}
app.image.url-path-prefix=/images
app.image.default-profile-path=profile/default.png

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ----------------------------------------------------------------------- IAP
# 인앱결제(구독) 연동 설정. 스토어 상품 등록 전에는 비워 둬도 기동에 지장이 없고,
# 멤버십 구매검증/웹훅 호출 시점에만 필요하다.
# 키 파일(.p8 / 서비스계정 JSON)은 저장소·이미지에 포함하지 않고 볼륨이나 시크릿 파일로 주입한다.
iap.apple.key-id=${IAP_APPLE_KEY_ID:}
iap.apple.issuer-id=${IAP_APPLE_ISSUER_ID:}
iap.apple.bundle-id=${IAP_APPLE_BUNDLE_ID:}
iap.apple.private-key-path=${IAP_APPLE_PRIVATE_KEY_PATH:}
iap.apple.base-url=${IAP_APPLE_BASE_URL:https://api.storekit.itunes.apple.com}

iap.google.package-name=${IAP_GOOGLE_PACKAGE_NAME:}
iap.google.service-account-key-path=${IAP_GOOGLE_SERVICE_ACCOUNT_KEY_PATH:}
iap.google.base-url=${IAP_GOOGLE_BASE_URL:https://androidpublisher.googleapis.com}
iap.google.token-url=${IAP_GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}

# ---------------------------------------------------------------------- CORS
# 콤마 구분 목록. FE 배포 도메인을 반드시 포함해야 한다.
# 예: https://mub-app.vercel.app,capacitor://localhost,ionic://localhost
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ------------------------------------------------------------------ Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ------------------------------------------------------------------- Logging
logging.level.root=INFO
logging.level.com.yeolcheong.mub=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------------- Swagger
# QA 기간에는 SWAGGER_ENABLED=true 로 열어 두고, 외부 공개 전에 반드시 false 로 되돌린다.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
