# ============================================
# Local Development Environment (IDE)
# ============================================

# Database Configuration - Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/member_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA Settings - Local Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show_sql=true

# JWT Configuration - Local
jwt.secret=localDevelopmentSecretKeyForMemberServiceJava21Environment123456789012345678901234567890abcdef
jwt.expiration=86400000

# Logging Configuration - Local (Detailed)
logging.level.com.location.member=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Java 21 Performance Settings
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Kakao OAuth Configuration
kakao.client-id=tempKakaoRestApiKey
kakao.auth-url=https://kauth.kakao.com/oauth/authorize
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.logout-rul=https://kapi.kakao.com/v1/user/logout
kakao.redirect-rui=http://localhost:8081/api/auth/kakao/callback
