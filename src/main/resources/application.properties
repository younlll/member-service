spring.application.name=member-service

# JWT \uC124\uC815
jwt.secret=mySecretKey123456789012345678901234567890
## 24\uC2DC\uAC04
jwt.access-token-expiration=86400000
## 60\uC77C
jwt.refresh-token-expiration=5184000000
jwt.token-validity-in-seconds=86400

# \uCE74\uCE74\uC624 OAuth \uC124\uC815
kakao.client-id=1fa8b12793a1c39ea5644631201edb14
kakao.redirect-uri=http://localhost:8080/api/auth/kakao/callback

# \uCE74\uCE74\uC624 OAuth URL
kakao.auth-url=https://kauth.kakao.com/oauth/authorize/
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.logout-url=https://kapi.kakao.com/v1/user/logout

# \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC124\uC815
spring.datasource.url=jdbc:mysql://localhost:3306/member_service?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA \uC124\uC815
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# \uB85C\uAE45 \uC124\uC815
logging.level.com.member=DEBUG
logging.level.org.springframework.security=DEBUG
